name: 쓰레드 예약 게시

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "post(글 올리기) 또는 알림테스트"
        default: "post"

permissions:
  contents: write

concurrency:
  group: post-queue
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 최신 상태로 맞추기 (줄 서서 기다린 실행이 옛날 상태로 또 올리는 것 방지)
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 시간이 된 글 올리기
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "알림테스트" ]; then python post_queue.py 알림테스트; else python post_queue.py; fi

      - name: 팔로워 수 기록 (바뀌었을 때만)
        if: always()
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: python follower_log.py || true

      - name: 올린 기록 저장
        if: always()
        run: |
          git config user.name "tenpm-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A posts stats/followers.csv
          git diff --cached --quiet || (git commit -m "자동 게시 기록" && git push)
