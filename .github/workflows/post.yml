name: 쓰레드 예약 게시

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "post(글 올리기) 또는 알림테스트"
        default: "post"

permissions:
  contents: write

concurrency:
  group: post-queue
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 최신 상태로 맞추기 (줄 서서 기다린 실행이 옛날 상태로 또 올리는 것 방지)
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 부계정 오늘의 골드박스 글 만들기 (08~11시, 하루 한 번)
        if: always()
        continue-on-error: true
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: |
          H=$(TZ=Asia/Seoul date +%H)
          if [ "$H" -ge 8 ] && [ "$H" -le 11 ] && [ -n "$COUPANG_ACCESS_KEY" ]; then pip install -q pillow && python deal_unit.py goldpost; fi

      - name: 시간이 된 글 올리기
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "알림테스트" ]; then python post_queue.py 알림테스트; else python post_queue.py; fi

      - name: 쿠팡 전용 계정 글 올리기 (토큰 있을 때만)
        if: always()
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN_DEAL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ACCOUNT: deal
        run: |
          if [ -n "$THREADS_TOKEN" ] && [ -d posts/deal/queue ]; then python post_queue.py; else echo "쿠팡 계정 미설정 - 건너뜀"; fi

      - name: 부계정 댓글 자동 답장 ("어디서 사요?" 같은 댓글에 링크)
        if: always()
        continue-on-error: true
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN_DEAL }}
          ACCOUNT: deal
        run: python autoreply.py

      - name: 팔로워 수 기록 (바뀌었을 때만)
        if: always()
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: python follower_log.py || true

      - name: AI 직원 사무실 상태 (바뀌었을 때만)
        if: always()
        continue-on-error: true
        run: python office/status.py

      - name: 올린 기록 저장
        if: always()
        run: |
          git config user.name "tenpm-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A posts images/deal curate stats office
          git diff --cached --quiet || git commit -m "자동 게시 기록"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && break; sleep 5; done
