name: 쓰레드 예약 게시

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: post-queue
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 시간이 된 글 올리기
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: python post_queue.py

      - name: 올린 기록 저장
        if: always()
        run: |
          git config user.name "tenpm-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A posts
          git diff --cached --quiet || (git commit -m "자동 게시 기록" && git push)
