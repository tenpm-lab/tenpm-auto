name: 모음 페이지 가격 갱신

on:
  workflow_dispatch:
  schedule:
    - cron: "37 18 * * *"   # 매일 03:37 KST

permissions:
  contents: write

concurrency:
  group: post-queue
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: git fetch origin main && git reset --hard origin/main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: 가격 가져오기
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: python bio/fetch_info.py || true
      - name: 페이지 다시 만들기
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: python bio/run.py
      - run: |
          git config user.name "tenpm-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A docs bio
          git diff --cached --quiet || git commit -m "모음 페이지 가격 갱신"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
