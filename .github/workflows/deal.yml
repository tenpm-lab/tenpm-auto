name: 단위 가격 특가 글

on:
  workflow_dispatch:
  schedule:
    - cron: "40 2,11 * * *"
  push:
    paths:
      - "deal/request.txt"

permissions:
  contents: write

concurrency:
  group: post-queue
  cancel-in-progress: false

jobs:
  deal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: git fetch origin main && git reset --hard origin/main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y -qq fonts-noto-cjk >/dev/null && pip install -q pillow
      - name: 글 만들기
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            H=$(TZ=Asia/Seoul date +%H); if [ "$H" -lt 17 ]; then M=1230; else M=2130; fi
          else M=$(cat deal/mode.txt 2>/dev/null || echo sample); fi
          python deal_unit.py "$M"
      - run: |
          git config user.name "tenpm-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A posts images/deal
          git diff --cached --quiet || git commit -m "특가 글"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
