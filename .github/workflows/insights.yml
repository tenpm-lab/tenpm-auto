name: 쓰레드 성과 수집

on:
  schedule:
    - cron: "40 14 * * *"   # 매일 한국 시간 23:40
  workflow_dispatch:
  push:
    paths:
      - "insights.py"
      - "coupang_stats.py"
      - ".github/workflows/insights.yml"

permissions:
  contents: write

concurrency:
  group: post-queue
  cancel-in-progress: false

jobs:
  insights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 성과 수집
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NOTIFY_SUMMARY: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: python insights.py
      - name: 부계정 성과 수집 (토큰 있을 때만)
        continue-on-error: true
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN_DEAL }}
          ACCOUNT: deal
          NOTIFY_SUMMARY: "0"
        run: if [ -n "$THREADS_TOKEN" ]; then python insights.py; fi
      - name: 쿠팡 수집
        continue-on-error: true
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NOTIFY_SUMMARY: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: python coupang_stats.py
      - name: 부계정 매일 점검 (조회는 있는데 클릭 0이면 원인 찾기·조치)
        continue-on-error: true
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python daily_check.py
          if [ -f stats/deal/relink.flag ]; then ACCOUNT=deal python coupang_links.py 적용 && rm stats/deal/relink.flag; fi
      - name: 기록 저장
        if: success()
        run: |
          git config user.name "tenpm-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats posts/deal
          git diff --cached --quiet || (git commit -m "성과 수집" && git pull --rebase && git push)
