name: 쓰레드 성과 수집

on:
  schedule:
    - cron: "40 14 * * *"   # 매일 한국 시간 23:40
  workflow_dispatch:
  push:
    paths:
      - "insights.py"
      - "coupang_stats.py"
      - ".github/workflows/insights.yml"

permissions:
  contents: write

concurrency:
  group: post-queue
  cancel-in-progress: false

jobs:
  insights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 성과 수집
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NOTIFY_SUMMARY: "1"
        run: python insights.py
      - name: 쿠팡 수집
        continue-on-error: true
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NOTIFY_SUMMARY: "1"
        run: python coupang_stats.py
      - name: 기록 저장
        if: success()
        run: |
          git config user.name "tenpm-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats
          git diff --cached --quiet || (git commit -m "성과 수집" && git pull --rebase && git push)
