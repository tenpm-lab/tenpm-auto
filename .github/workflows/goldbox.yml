name: 부계정 오늘의 골드박스 글

on:
  workflow_dispatch:
  schedule:
    - cron: "10 23 * * *"   # 매일 08:10 KST (골드박스는 07:30 갱신) → 09:00 게시
  push:
    paths:
      - "deal/gold_request.txt"

permissions:
  contents: write

concurrency:
  group: post-queue
  cancel-in-progress: false

jobs:
  gold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: git fetch origin main && git reset --hard origin/main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 골드박스 글 만들기
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: python deal_unit.py goldpost
      - run: |
          git config user.name "tenpm-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A posts
          git diff --cached --quiet || git commit -m "부계정 골드박스 글"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
