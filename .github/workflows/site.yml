name: 써본 것 모음 페이지

on:
  workflow_dispatch:
  # push 트리거 끔 (11/26: 모음 페이지 내림)

permissions:
  contents: write

concurrency:
  group: post-queue
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: git fetch origin main && git reset --hard origin/main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: 페이지 만들기
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: python bio/run.py
      - run: |
          git config user.name "tenpm-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p docs
          git add -A docs bio stats
          git diff --cached --quiet || git commit -m "모음 페이지 갱신"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
