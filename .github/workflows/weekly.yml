name: 주간 리포트

on:
  schedule:
    - cron: "0 10 * * 0"   # 매주 일요일 한국 시간 19:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: post-queue
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 최신 상태로 맞추기
        run: git fetch origin main && git reset --hard origin/main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 성과 새로 받기
        continue-on-error: true
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: |
          python insights.py
          python coupang_stats.py
      - name: 리포트 만들기
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python weekly_report.py > /tmp/report.txt
          if [ -n "$NTFY_TOPIC" ]; then
            head -4 /tmp/report.txt | tail -2 | curl -s -H "Title: 📈 주간 리포트 나옴 (AI가 분석 중)" -H "Tags: chart_with_upwards_trend" --data-binary @- "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
          fi
      - name: 저장
        run: |
          git config user.name "tenpm-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats
          git diff --cached --quiet || (git commit -m "주간 리포트" && git pull --rebase && git push)
