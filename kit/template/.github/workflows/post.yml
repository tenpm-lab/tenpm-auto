name: 예약 게시

on:
  schedule:
    - cron: "*/15 * * * *"   # 15분마다 (GitHub 사정으로 몇 분~수십 분 늦을 수 있어요)
  workflow_dispatch:
    inputs:
      mode:
        description: "post(글 올리기) 또는 알림테스트"
        default: "post"

permissions:
  contents: write

concurrency:
  group: post-queue
  cancel-in-progress: false

jobs:
  post:
    if: github.repository != 'tenpm-lab/ai-office-kit'   # 키트 원본에서는 안 돌고, 복사한 내 저장소에서만 돌아요
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 최신 상태로 맞추기
        run: git fetch origin main && git reset --hard origin/main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 시간 된 글 올리기
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "알림테스트" ]; then python post_queue.py 알림테스트; else python post_queue.py; fi

      - name: 댓글 자동 답장
        if: always()
        continue-on-error: true
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: python auto_reply.py

      - name: 팔로워 수 기록
        if: always()
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: python follower_log.py || true

      - name: AI 사무실 상태
        if: always()
        continue-on-error: true
        run: python office/status.py

      - name: 기록 저장
        if: always()
        run: |
          git config user.name "my-ai-office"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A posts stats office
          git diff --cached --quiet || (git commit -m "자동 게시 기록" && git pull --rebase && git push)
