name: 토큰 연장

on:
  schedule:
    - cron: "17 1 1,15 * *"   # 매달 1일·15일 한국 시간 10:17
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: post-queue
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 최신 상태로 맞추기
        run: git fetch origin main && git reset --hard origin/main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pynacl
      - name: 연장
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python token_refresh.py
      - name: 기록 저장
        if: always()
        run: |
          git config user.name "my-ai-office"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/token_log.txt || true
          git diff --cached --quiet || (git commit -m "토큰 연장 기록" && git pull --rebase && git push)
